name: Release
run-name: ${{ inputs.version && format('Release {0} at {1}', inputs.version, inputs.commit) || 'Release dry run' }}

# Starts a release, or a dry run, when dispatched on main. The jobs are in
# release-sign.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.3. Leave empty for a dry run
        required: false
        type: string
      commit:
        description: Full SHA of the commit on main to release. Required with a version
        required: false
        type: string
      dryrun:
        description: Build and sign the installers without publishing them
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ !inputs.version }}

jobs:
  release:
    uses: coder/coder-desktop-windows/.github/workflows/release-sign.yml@main # zizmor: ignore[secrets-inherit,unpinned-uses]
    with:
      version: ${{ inputs.version || '' }}
      commit: ${{ inputs.commit || '' }}
      dryrun: ${{ inputs.dryrun || false }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
